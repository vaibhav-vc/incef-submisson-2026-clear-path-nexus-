# Requires Docker Compose 2.24.4+; !reset prevents inherited host-port exposure.
services:
  postgres:
    ports: !reset []

  redis:
    ports: !reset []

  backend:
    ports: !reset []
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      AUTH_DISABLED: "false"
      DEMO_DATA_ENABLED: "false"
      AUTH_COOKIE_SECURE: "true"
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS to the exact HTTPS web origin}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Set ALLOWED_HOSTS to the API and edge hostnames}

  frontend:
    ports: !reset []
    build:
      args:
        VITE_LOCAL_DEMO_MODE: "false"

  live-ingestor:
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      DEMO_DATA_ENABLED: "false"
      AUTH_DISABLED: "false"

  train-synchronizer:
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      DEMO_DATA_ENABLED: "false"
      AUTH_DISABLED: "false"

  https:
    depends_on:
      frontend:
        condition: service_healthy
