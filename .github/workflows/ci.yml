name: Continuous Integration

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall app scripts alembic
      - run: ruff check app scripts alembic
      - run: python -m pytest -q
      - run: python -m unittest discover -s submission/tests -v
        working-directory: .

  deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Disposable CI fixtures only. Never use these values in a real deployment.
    env:
      SECRET_KEY: ci-only-session-secret-not-for-deployment-001
      EVIDENCE_SIGNING_KEY: ci-only-evidence-secret-not-for-deployment-002
      POSTGRES_PASSWORD: ci-only-database-password-003
      SUPABASE_URL: https://auth.evidencegate.test
      VITE_SUPABASE_URL: https://auth.evidencegate.test
      VITE_SUPABASE_ANON_KEY: sb_publishable_synthetic_ci_fixture_only
      DOMAIN: evidencegate.test
      CORS_ORIGINS: '["https://evidencegate.test"]'
      ALLOWED_HOSTS: '["evidencegate.test","127.0.0.1","backend"]'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s scripts/tests -v
      - run: python scripts/deployment_preflight.py --env-file .env.example
      - name: Build and exercise production API with real PostgreSQL and Redis
        run: docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.prod.yml up -d --build --wait --wait-timeout 180 backend
      - name: Confirm live readiness inside the API container
        run: docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.prod.yml exec -T backend python -c "import json, urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5))['status'] == 'ready'"
      - name: Remove disposable services and volumes
        if: always()
        run: docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.prod.yml down --volumes

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build:online
      - run: pnpm run build:judge
      - name: Confirm judge build has an offline network boundary
        run: |
          grep -q "Content-Security-Policy" dist/index.html
          grep -q "connect-src.*self" dist/index.html
      - run: pnpm run lint
      - run: pnpm audit --prod --audit-level=high

  judge-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Build and smoke-test the self-contained judge edition
        run: |
          chmod +x scripts/start_judge_demo.sh backend/scripts/start.sh
          ./scripts/start_judge_demo.sh
      - name: Dump judge service logs when startup fails
        if: failure()
        env:
          JUDGE_DEMO_POSTGRES_PASSWORD: diagnostic-placeholder-value
          JUDGE_DEMO_SESSION_SECRET: diagnostic-placeholder-value
          JUDGE_DEMO_EVIDENCE_SIGNING_KEY: diagnostic-placeholder-value
          JUDGE_DEMO_EVIDENCE_SIGNING_KEY_ID: judge-demo-diagnostic
        run: |
          docker compose --env-file .env.judge-demo.state -f docker-compose.judge-demo.yml ps -a
          docker compose --env-file .env.judge-demo.state -f docker-compose.judge-demo.yml logs --no-color --tail=300 backend postgres redis
      - name: Confirm the published LAN gateway is ready
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8080/ready
          curl --fail --silent --show-error http://127.0.0.1:8080/api/v1/planner/stations
      - name: Remove disposable judge services and volume
        if: always()
        env:
          JUDGE_DEMO_POSTGRES_PASSWORD: stop-only-placeholder-value
          JUDGE_DEMO_SESSION_SECRET: stop-only-placeholder-value
        run: docker compose --env-file .env.judge-demo.state -f docker-compose.judge-demo.yml down --volumes --remove-orphans

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - run: chmod +x gradlew
      - run: ./gradlew testDebugUnitTest assembleDebug lintDebug --no-daemon
